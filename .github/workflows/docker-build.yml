name: Build & Push Multi-Version Docker Images

on:
  push:
    branches:
      - master
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:
    inputs:
      push_images:
        description: 'Push images ke registry'
        required: true
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.target.tag }} (${{ matrix.platform.suffix }})
    runs-on: ${{ matrix.platform.os }}
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - php: '8.5'
            phalcon: '5.23.0'
            patch: 'false'
            tag: '8.5'
          - php: '8.3'
            phalcon: '5.23.0'
            patch: 'false'
            tag: '8.3'
          - php: '8.3'
            phalcon: '5.8.0'
            patch: 'false'
            tag: '8.3-phalcon5.8'
          - php: '8.1'
            phalcon: '5.1.4'
            patch: 'true'
            tag: '8.1-phalcon5.1'
        platform:
          - os: ubuntu-latest
            arch: linux/amd64
            suffix: amd64
          - os: ubuntu-24.04-arm
            arch: linux/arm64
            suffix: arm64

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry (GHCR)
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.push_images)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        if: env.DOCKERHUB_USERNAME != '' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.push_images))
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tentukan Tags dan Argumen
        id: meta
        run: |
          PHP_VER="${{ matrix.target.php }}"
          PHALCON_VER="${{ matrix.target.phalcon }}"
          PHP_PATCH="${{ matrix.target.patch }}"
          TAG_NAME="${{ matrix.target.tag }}"
          SUFFIX="${{ matrix.platform.suffix }}"
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          
          TAGS="ghcr.io/${OWNER_LC}/nginx-php8-phalcon5:${TAG_NAME}-${SUFFIX}"
          if [ -n "$DOCKERHUB_USERNAME" ]; then
            TAGS="${TAGS},${DOCKERHUB_USERNAME}/nginx-php8-phalcon5:${TAG_NAME}-${SUFFIX}"
          fi
          
          echo "php_version=${PHP_VER}" >> $GITHUB_OUTPUT
          echo "phalcon_version=${PHALCON_VER}" >> $GITHUB_OUTPUT
          echo "php_patch=${PHP_PATCH}" >> $GITHUB_OUTPUT
          echo "tags=${TAGS}" >> $GITHUB_OUTPUT

      - name: Build and Push (Native Architecture)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform.arch }}
          push: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.push_images) }}
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            PHP_VERSION=${{ steps.meta.outputs.php_version }}
            PHALCON_VERSION=${{ steps.meta.outputs.phalcon_version }}
            PHP_PATCH=${{ steps.meta.outputs.php_patch }}
          cache-from: type=gha,scope=${{ matrix.target.tag }}-${{ matrix.platform.suffix }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target.tag }}-${{ matrix.platform.suffix }}

  merge:
    name: Merge Manifest ${{ matrix.target.tag }}
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.push_images)
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    strategy:
      matrix:
        target:
          - tag: '8.5'
            is_latest: true
          - tag: '8.3'
            is_latest: false
          - tag: '8.3-phalcon5.8'
            is_latest: false
          - tag: '8.1-phalcon5.1'
            is_latest: false

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Gabungkan Manifest Multi-Arch
        run: |
          TAG_NAME="${{ matrix.target.tag }}"
          IS_LATEST="${{ matrix.target.is_latest }}"
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          
          echo "Menggabungkan manifest untuk GHCR..."
          GHCR_TARGETS="-t ghcr.io/${OWNER_LC}/nginx-php8-phalcon5:${TAG_NAME}"
          if [ "$IS_LATEST" = "true" ]; then
            GHCR_TARGETS="${GHCR_TARGETS} -t ghcr.io/${OWNER_LC}/nginx-php8-phalcon5:latest"
          fi
          
          docker buildx imagetools create ${GHCR_TARGETS} \
            ghcr.io/${OWNER_LC}/nginx-php8-phalcon5:${TAG_NAME}-amd64 \
            ghcr.io/${OWNER_LC}/nginx-php8-phalcon5:${TAG_NAME}-arm64
          
          if [ -n "$DOCKERHUB_USERNAME" ]; then
            echo "Menggabungkan manifest untuk Docker Hub..."
            DH_TARGETS="-t ${DOCKERHUB_USERNAME}/nginx-php8-phalcon5:${TAG_NAME}"
            if [ "$IS_LATEST" = "true" ]; then
              DH_TARGETS="${DH_TARGETS} -t ${DOCKERHUB_USERNAME}/nginx-php8-phalcon5:latest"
            fi
            
            docker buildx imagetools create ${DH_TARGETS} \
              ${DOCKERHUB_USERNAME}/nginx-php8-phalcon5:${TAG_NAME}-amd64 \
              ${DOCKERHUB_USERNAME}/nginx-php8-phalcon5:${TAG_NAME}-arm64
          fi
          
          echo "✓ Selesai membuat manifest multi-arch untuk ${TAG_NAME}!"
