name: Build & Push Multi-Version Docker Images

on:
  push:
    branches:
      - master
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:
    inputs:
      push_images:
        description: 'Push images ke registry'
        required: true
        type: boolean
        default: true
      phalcon_version:
        description: 'Versi Phalcon'
        required: true
        type: string
        default: '5.23.0'

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build PHP ${{ matrix.php }} (${{ matrix.platform.suffix }})
    runs-on: ${{ matrix.platform.os }}
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    strategy:
      fail-fast: false
      matrix:
        php: ['8.5', '8.3']
        platform:
          - os: ubuntu-latest
            arch: linux/amd64
            suffix: amd64
          - os: ubuntu-24.04-arm
            arch: linux/arm64
            suffix: arm64

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry (GHCR)
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.push_images)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        if: env.DOCKERHUB_USERNAME != '' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.push_images))
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tentukan Tags dan Argumen
        id: meta
        env:
          INPUT_PHALCON_VERSION: ${{ inputs.phalcon_version }}
        run: |
          PHP_VER="${{ matrix.php }}"
          SUFFIX="${{ matrix.platform.suffix }}"
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          
          PHALCON_VER="${INPUT_PHALCON_VERSION:-5.23.0}"
          echo "phalcon_version=${PHALCON_VER}" >> $GITHUB_OUTPUT
          
          TAGS="ghcr.io/${OWNER_LC}/nginx-php8-phalcon5:${PHP_VER}-${SUFFIX}"
          if [ -n "$DOCKERHUB_USERNAME" ]; then
            TAGS="${TAGS},${DOCKERHUB_USERNAME}/nginx-php8-phalcon5:${PHP_VER}-${SUFFIX}"
          fi
          
          echo "tags=${TAGS}" >> $GITHUB_OUTPUT

      - name: Build and Push (Native Architecture)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform.arch }}
          push: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.push_images) }}
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            PHP_VERSION=${{ matrix.php }}
            PHALCON_VERSION=${{ steps.meta.outputs.phalcon_version }}
          cache-from: type=gha,scope=${{ matrix.php }}-${{ matrix.platform.suffix }}
          cache-to: type=gha,mode=max,scope=${{ matrix.php }}-${{ matrix.platform.suffix }}

  merge:
    name: Merge Manifest PHP ${{ matrix.php }}
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.push_images)
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    strategy:
      matrix:
        include:
          - php: '8.5'
            is_latest: true
          - php: '8.3'
            is_latest: false

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Gabungkan Manifest Multi-Arch
        run: |
          PHP_VER="${{ matrix.php }}"
          IS_LATEST="${{ matrix.is_latest }}"
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          
          echo "Menggabungkan manifest untuk GHCR..."
          GHCR_TARGETS="-t ghcr.io/${OWNER_LC}/nginx-php8-phalcon5:${PHP_VER}"
          if [ "$IS_LATEST" = "true" ]; then
            GHCR_TARGETS="${GHCR_TARGETS} -t ghcr.io/${OWNER_LC}/nginx-php8-phalcon5:latest"
          fi
          
          docker buildx imagetools create ${GHCR_TARGETS} \
            ghcr.io/${OWNER_LC}/nginx-php8-phalcon5:${PHP_VER}-amd64 \
            ghcr.io/${OWNER_LC}/nginx-php8-phalcon5:${PHP_VER}-arm64
          
          if [ -n "$DOCKERHUB_USERNAME" ]; then
            echo "Menggabungkan manifest untuk Docker Hub..."
            DH_TARGETS="-t ${DOCKERHUB_USERNAME}/nginx-php8-phalcon5:${PHP_VER}"
            if [ "$IS_LATEST" = "true" ]; then
              DH_TARGETS="${DH_TARGETS} -t ${DOCKERHUB_USERNAME}/nginx-php8-phalcon5:latest"
            fi
            
            docker buildx imagetools create ${DH_TARGETS} \
              ${DOCKERHUB_USERNAME}/nginx-php8-phalcon5:${PHP_VER}-amd64 \
              ${DOCKERHUB_USERNAME}/nginx-php8-phalcon5:${PHP_VER}-arm64
          fi
          
          echo "✓ Selesai membuat manifest multi-arch untuk PHP ${PHP_VER}!"
